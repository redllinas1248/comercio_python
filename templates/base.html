<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="theme-color" content="#0f172a"/>
  <meta name="description" content="Ventas Locales José Azueta"/>
  <title>Ventas Locales — José Azueta</title>
  <link rel="manifest" href="/static/manifest.json"/>
  <link rel="apple-touch-icon" href="/static/img/icon-192.png"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Serif+Display&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="/static/css/app.css"/>
</head>
<body>

  <!-- Banner -->
  <div class="site-banner">
    <img src="{{ logo_url }}" alt="Ventas Locales José Azueta" class="banner-img"/>
  </div>

  <!-- Navbar -->
  <nav class="navbar">
    <a href="/" class="brand">
      <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
        <path d="M3 9.5L12 3l9 6.5V20a1 1 0 01-1 1H5a1 1 0 01-1-1V9.5z"/><path d="M9 21V12h6v9"/>
      </svg>
      <span>Inicio</span>
    </a>
    <div class="nav-links">
      <span class="visit-counter" title="Visitas totales">
        <svg width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
          <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12z"/><circle cx="12" cy="12" r="2.5"/>
        </svg>
        <span>{{ "{:,}".format(visitas_totales).replace(",", ".") }}</span>
      </span>
      <a href="/buscar" class="nav-link" title="Buscar">
        <svg width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
          <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
      </a>
      <a href="/mensajes" class="nav-link nav-auth" style="display:none" title="Mensajes">
        <svg width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
          <path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/>
        </svg>
      </a>
      <a href="/notificaciones" class="nav-link nav-auth nav-notif" style="display:none" id="badge-notif" title="Notificaciones">
        <svg width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
          <path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 01-3.46 0"/>
        </svg>
        <span class="notif-badge" id="notif-count" style="display:none"></span>
      </a>
      <a href="/perfil" class="nav-link nav-auth" style="display:none" title="Perfil">
        <svg width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
          <circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/>
        </svg>
      </a>
      <a href="/login" class="nav-link nav-guest nav-login-btn" title="Iniciar sesión">
        <svg width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
          <path d="M15 3h4a2 2 0 012 2v14a2 2 0 01-2 2h-4"/>
          <polyline points="10 17 15 12 10 7"/>
          <line x1="15" y1="12" x2="3" y2="12"/>
        </svg>
      </a>
    </div>
  </nav>

  <main id="app" class="container">
    {% block content %}{% endblock %}
  </main>

  <div id="toast" class="toast hidden"></div>

  <!-- app.js al final del body, antes de cualquier script inline -->
  <script src="/static/js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/static/sw.js')
        .then(() => console.log('SW ok'))
        .catch(() => {});
    }
  </script>
</body>
</html>
