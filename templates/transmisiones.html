{% extends "base.html" %}
{% block content %}

<div class="dir-header">
  <button class="btn-back" onclick="history.back()">
    <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
      <polyline points="15 18 9 12 15 6"/>
    </svg> Volver
  </button>
  <h2 class="dir-title">📺 Transmisiones en vivo</h2>
  <p class="dir-sub">Selecciona un canal para ver su transmisión en vivo</p>
</div>

<!-- ===== REPRODUCTOR ===== -->
<div class="youtube-live-wrap" style="margin-bottom:1.5rem;">
  <div class="youtube-live-header">
    <span class="youtube-live-dot"></span>
    <div class="youtube-live-info">
      <span class="youtube-live-title" id="reproductor-titulo">Cargando...</span>
      <span class="youtube-live-sub" id="reproductor-sub">🔴 En vivo</span>
    </div>
  </div>
  <div class="youtube-live-video">
    <iframe
      id="reproductor"
      src=""
      title="Transmisión en vivo"
      frameborder="0"
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
      referrerpolicy="strict-origin-when-cross-origin"
      allowfullscreen>
    </iframe>
  </div>
</div>

<!-- ===== LISTA DE TRANSMISIONES ===== -->
<div id="transmisiones-wrap">
  <div id="transmisiones-lista" class="trans-lista">
    <!-- Cargado dinámicamente -->
  </div>
</div>

<script>
// ===== FUNCIÓN PARA OBTENER URL DE EMBED =====
function obtenerEmbedUrl(url) {
  url = url.trim();
  // Si es un ID de video de 11 caracteres
  if (url.length === 11 && /^[a-zA-Z0-9_-]+$/.test(url) && url.includes('-')) {
    return `https://www.youtube.com/embed/${url}`;
  }
  // Si es una URL de YouTube
  if (url.includes('youtube.com/watch?v=')) {
    const videoId = url.split('v=')[1].split('&')[0];
    return `https://www.youtube.com/embed/${videoId}`;
  }
  if (url.includes('youtu.be/')) {
    const videoId = url.split('youtu.be/')[1].split('?')[0];
    return `https://www.youtube.com/embed/${videoId}`;
  }
  if (url.includes('youtube.com/embed/')) {
    return url;
  }
  if (url.includes('youtube.com/live_stream?channel=')) {
    return url;
  }
  // Si no, devolver la URL tal cual
  return url;
}

// ===== CARGAR TRANSMISIONES =====
async function cargarTransmisiones() {
  const wrap = document.getElementById('transmisiones-lista');
  wrap.innerHTML = `<div class="spinner-feed"><span></span><span></span><span></span></div>`;
  try {
    const transmisiones = await api('/api/transmisiones/publicas');
    if (!transmisiones.length) {
      wrap.innerHTML = `
        <div class="empty">
          <div class="empty-icon">📺</div>
          <p>No hay transmisiones disponibles en este momento.</p>
        </div>`;
      return;
    }

    // Encontrar la primera destacada para el reproductor por defecto
    const destacada = transmisiones.find(t => t.destacada) || transmisiones[0];
    const embedUrl = obtenerEmbedUrl(destacada.url);
    document.getElementById('reproductor').src = embedUrl;
    document.getElementById('reproductor-titulo').textContent = destacada.titulo;
    document.getElementById('reproductor-sub').textContent = destacada.descripcion || '🔴 En vivo';

    // Agrupar por categoría
    const categorias = {
      noticias: { icono: '📰', label: 'Noticias', items: [] },
      deportes: { icono: '⚽', label: 'Deportes', items: [] },
      eventos: { icono: '🎥', label: 'Eventos especiales', items: [] }
    };

    transmisiones.forEach(t => {
      if (categorias[t.categoria]) {
        categorias[t.categoria].items.push(t);
      }
    });

    let html = '';
    for (const [key, cat] of Object.entries(categorias)) {
      if (!cat.items.length) continue;
      html += `
        <div class="dir-grupo">
          <div class="dir-grupo-titulo">${cat.icono} ${cat.label}</div>
          <div class="dir-lista">
            ${cat.items.map(t => `
              <div class="dir-item">
                <div class="dir-ico">${cat.icono}</div>
                <div class="dir-info">
                  <div class="dir-nombre">${escapeHtml(t.titulo)}</div>
                  ${t.descripcion ? `<div class="dir-dato">${escapeHtml(t.descripcion)}</div>` : ''}
                  ${t.destacada ? `<span style="color:#f59e0b;font-size:.7rem;font-weight:600;">⭐ Destacada</span>` : ''}
                </div>
                <button class="dir-tel-btn" style="background:rgba(239,68,68,.15);color:#ef4444;border-color:rgba(239,68,68,.3);cursor:pointer;" 
                        onclick="cambiarTransmision('${escapeHtml(t.url)}', '${escapeHtml(t.titulo)}', '${escapeHtml(t.descripcion || '🔴 En vivo')}')">
                  <span class="live-dot" style="display:inline-block;width:8px;height:8px;background:#ef4444;border-radius:50%;margin-right:4px;animation:pulse-dot 1.2s ease-in-out infinite;"></span>
                  Ver ahora
                </button>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }

    wrap.innerHTML = html;

  } catch(e) {
    wrap.innerHTML = `<div class="empty"><p>${escapeHtml(e.message)}</p></div>`;
  }
}

// ===== CAMBIAR TRANSMISIÓN EN EL REPRODUCTOR =====
function cambiarTransmision(url, titulo, descripcion) {
  const embedUrl = obtenerEmbedUrl(url);
  document.getElementById('reproductor').src = embedUrl;
  document.getElementById('reproductor-titulo').textContent = titulo;
  document.getElementById('reproductor-sub').textContent = descripcion || '🔴 En vivo';
}

// ===== INICIO =====
document.addEventListener('DOMContentLoaded', cargarTransmisiones);
</script>

<style>
  @keyframes pulse-dot {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.4; transform: scale(0.8); }
  }
  .live-dot {
    display: inline-block;
    width: 8px;
    height: 8px;
    background: #ef4444;
    border-radius: 50%;
    margin-right: 4px;
    animation: pulse-dot 1.2s ease-in-out infinite;
  }
  .dir-tel-btn {
    cursor: pointer;
    border: none;
    font-family: inherit;
    font-size: 0.8rem;
    font-weight: 600;
    padding: 0.45rem 0.75rem;
    border-radius: 8px;
    display: inline-flex;
    align-items: center;
    white-space: nowrap;
    flex-shrink: 0;
    transition: background 0.15s;
    text-decoration: none;
  }
  .dir-tel-btn:hover {
    opacity: 0.85;
  }
  .trans-lista {
    display: flex;
    flex-direction: column;
    gap: 1rem;
  }
</style>
{% endblock %}
