{% extends "base.html" %}
{% block content %}
<div class="admin-wrap">
  <div class="admin-header">
    <h2 class="admin-title">⚙️ Panel Admin</h2>
  </div>

  <div class="admin-tabs">
    <button class="admin-tab active" onclick="setAdminTab('pubs', this)">Publicaciones</button>
    <button class="admin-tab" onclick="setAdminTab('users', this)">Usuarios</button>
    <button class="admin-tab" onclick="setAdminTab('directorio', this)">Directorio</button>
    <button class="admin-tab" onclick="setAdminTab('transmisiones', this)">Transmisiones</button>
    <button class="admin-tab" onclick="setAdminTab('config', this)">Configuración</button>
  </div>

  <!-- PUBLICACIONES -->
  <div id="admin-pubs">
    <div id="pubs-wrap"></div>
  </div>

  <!-- USUARIOS -->
  <div id="admin-users" style="display:none">
    <div id="users-wrap"></div>
  </div>

  <!-- DIRECTORIO -->
   <div class="p-field" style="grid-column:span 4">
  <label>Foto (URL)</label>
  <input id="df-foto" type="text" placeholder="https://ejemplo.com/foto.jpg"/>
</div>
<div class="p-field" style="grid-column:span 4">
  <label>Descripción corta</label>
  <textarea id="df-descripcion" rows="2" placeholder="Breve descripción del servicio..." style="background:var(--bg3);border:1px solid var(--border);border-radius:10px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:.9rem;padding:.65rem .85rem;outline:none;width:100%;resize:vertical;"></textarea>
</div>
  <div id="admin-directorio" style="display:none">
    <div class="dir-admin-form" id="dir-form">
      <h3 class="p-section-title" style="margin-bottom:.75rem">Agregar entrada</h3>
      <div class="dir-form-grid">
        <div class="p-field">
          <label>Ícono</label>
          <input id="df-icono" type="text" value="📍" placeholder="Emoji" maxlength="4" style="width:70px"/>
        </div>
        <div class="p-field" style="grid-column:span 2">
          <label>Categoría</label>
          <input id="df-cat" type="text" placeholder="Ej: Farmacias, Emergencias, Hospitales..." list="cats-list"/>
          <datalist id="cats-list"></datalist>
        </div>
        <div class="p-field" style="grid-column:span 1">
          <label>Tipo</label>
          <select id="df-tipo" class="select-field" style="width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:10px;color:var(--text);padding:.65rem .85rem;outline:none;">
            <option value="servicios">🔧 Servicios</option>
            <option value="emergencias">🚨 Emergencias</option>
            <option value="general">📌 General</option>
          </select>
        </div>
        <div class="p-field" style="grid-column:span 3">
          <label>Nombre</label>
          <input id="df-nombre" type="text" placeholder="Ej: Farmacia Similar"/>
        </div>
        <div class="p-field" style="grid-column:span 2">
          <label>Teléfono</label>
          <input id="df-tel" type="tel" placeholder="Ej: 322 123 4567"/>
        </div>
        <div class="p-field" style="grid-column:span 2">
          <label>Horario</label>
          <input id="df-horario" type="text" placeholder="Ej: 8:00am - 10:00pm"/>
        </div>
        <div class="p-field" style="grid-column:span 4">
          <label>Dirección (opcional)</label>
          <input id="df-dir" type="text" placeholder="Ej: Calle Hidalgo 45"/>
        </div>
      </div>
      <button class="p-btn-save" style="margin-top:.75rem" onclick="guardarDir()">
        <span class="btn-text" id="df-btn-txt">➕ Agregar</span>
        <div class="spinner-btn"></div>
      </button>
      <input type="hidden" id="df-edit-id" value=""/>
    </div>
    <div id="dir-admin-wrap" style="margin-top:1rem"></div>
  </div>

  <!-- ===== TRANSMISIONES (NUEVO) ===== -->
  <div id="admin-transmisiones" style="display:none">
    <div class="trans-admin-form" id="trans-form">
      <h3 class="p-section-title" style="margin-bottom:.75rem">Agregar transmisión</h3>
      <div class="trans-form-grid">
        <div class="p-field" style="grid-column:span 3">
          <label>Título *</label>
          <input id="tf-titulo" type="text" placeholder="Ej: Milenio Noticias"/>
        </div>
        <div class="p-field" style="grid-column:span 1">
          <label>Categoría</label>
          <select id="tf-categoria" class="select-field" style="width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:10px;color:var(--text);padding:.65rem .85rem;outline:none;">
            <option value="noticias">📰 Noticias</option>
            <option value="deportes">⚽ Deportes</option>
            <option value="eventos">🎥 Eventos</option>
          </select>
        </div>
        <div class="p-field" style="grid-column:span 4">
          <label>URL o ID de YouTube *</label>
          <input id="tf-url" type="text" placeholder="ID de video (ej: oPy8a-TCjzA) o URL completa"/>
          <small style="color:var(--muted);font-size:.7rem;">Ej: oPy8a-TCjzA o https://www.youtube.com/@CanalOnceIPN/live</small>
        </div>
        <div class="p-field" style="grid-column:span 3">
          <label>Descripción (opcional)</label>
          <input id="tf-descripcion" type="text" placeholder="Breve descripción de la transmisión"/>
        </div>
        <div class="p-field" style="grid-column:span 1">
          <label>Orden</label>
          <input id="tf-orden" type="number" value="0" min="0" style="width:100%;"/>
        </div>
        <div class="p-field" style="grid-column:span 2">
          <label style="display:flex;align-items:center;gap:.5rem;cursor:pointer;">
            <input id="tf-destacada" type="checkbox" /> Destacada
          </label>
        </div>
        <div class="p-field" style="grid-column:span 2">
          <label style="display:flex;align-items:center;gap:.5rem;cursor:pointer;">
            <input id="tf-activo" type="checkbox" checked /> Activa
          </label>
        </div>
      </div>
      <button class="p-btn-save" style="margin-top:.75rem" onclick="guardarTrans()">
        <span class="btn-text" id="tf-btn-txt">➕ Agregar</span>
        <div class="spinner-btn"></div>
      </button>
      <input type="hidden" id="tf-edit-id" value=""/>
    </div>
    <div id="trans-admin-wrap" style="margin-top:1rem"></div>
  </div>

  <!-- CONFIGURACIÓN -->
  <div id="admin-config" style="display:none">
    <div class="admin-config-card">
      <p class="admin-config-help">Sube un logo personalizado para el banner superior de tu sitio.</p>
      <div class="logo-config-preview" id="logo-preview-container">
        <img src="{{ logo_url }}" alt="Logo actual" id="logo-preview-img" />
      </div>
      <form id="logo-form" class="logo-upload-form" enctype="multipart/form-data">
        <label class="logo-file-label p-btn-save" style="background:var(--bg3);color:var(--text);border:1px solid var(--border);cursor:pointer;padding:.6rem 1rem;border-radius:10px;display:inline-flex;align-items:center;gap:.5rem;">
          📁 Seleccionar imagen
          <input type="file" name="logo" accept="image/*" style="display:none" onchange="mostrarNombreArchivo(this)" />
        </label>
        <span class="logo-file-name" id="logo-file-name">Ningún archivo seleccionado</span>
        <button type="button" class="p-btn-save" id="btn-subir-logo" onclick="subirLogo()">
          <span class="btn-text">Actualizar Logo</span>
          <div class="spinner-btn"></div>
        </button>
      </form>
    </div>
  </div>
</div>

<script>
// ===== NAVEGACIÓN ENTRE TABS =====
function setAdminTab(tab, el) {
  document.querySelectorAll('.admin-tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('admin-pubs').style.display        = tab === 'pubs'         ? 'block' : 'none';
  document.getElementById('admin-users').style.display       = tab === 'users'        ? 'block' : 'none';
  document.getElementById('admin-directorio').style.display  = tab === 'directorio'   ? 'block' : 'none';
  document.getElementById('admin-transmisiones').style.display = tab === 'transmisiones' ? 'block' : 'none';
  document.getElementById('admin-config').style.display      = tab === 'config'       ? 'block' : 'none';
  
  if (tab === 'pubs')         cargarAdminPubs();
  if (tab === 'users')        cargarAdminUsers();
  if (tab === 'directorio')   cargarAdminDir();
  if (tab === 'transmisiones') cargarAdminTrans();
}

// ===== PUBLICACIONES (funciones ya existentes) =====
async function cargarAdminPubs() {
  const wrap = document.getElementById('pubs-wrap');
  wrap.innerHTML = `<div class="spinner-feed"><span></span><span></span><span></span></div>`;
  try {
    const pubs = await api('/api/publicaciones/admin/lista');
    wrap.innerHTML = `
      <div class="admin-table-wrap">
        <table class="admin-table">
          <thead><tr><th>⭐</th><th>#</th><th>Autor</th><th>Contenido</th><th>❤️</th><th>💬</th><th>Fecha</th><th></th></tr></thead>
          <tbody>
            ${pubs.map(p => `
              <tr id="row-pub-${p.id}">
                <td><span id="dest-star-${p.id}" style="opacity:${p.likes >= 0 ? '0.3' : '1'}">⭐</span></td>
                <td>${p.id}</td>
                <td>
                  <a href="/usuario/${encodeJsValue(p.telefono)}" class="admin-link">${escapeHtml(p.autor || p.telefono)}</a>
                </td>
                <td class="admin-td-content">
                  <a href="/publicacion/${p.id}" class="admin-link">${escapeHtml(p.contenido)}</a>
                </td>
                <td>${p.likes}</td>
                <td>${p.comentarios}</td>
                <td>${timeAgo(p.fecha)}</td>
                <td>
                  <button class="admin-btn-dest ${p.likes > 0 ? '' : ''}"
                    id="dest-btn-${p.id}"
                    onclick="toggleDestacada(${p.id})"
                    title="Destacar publicación">⭐</button>
                  <button class="admin-btn-del" onclick="eliminarPubAdmin(${p.id})" title="Eliminar">
                    <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                      <polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/>
                      <path d="M10 11v6M14 11v6M9 6V4h6v2"/>
                    </svg>
                  </button>
                </td>
              </tr>`).join('')}
          </tbody>
        </table>
      </div>`;
  } catch(e) {
    wrap.innerHTML = `<div class="empty"><p>${escapeHtml(e.message)}</p></div>`;
  }
}

async function toggleDestacada(id) {
  const star = document.getElementById(`dest-star-${id}`);
  const activa = star && star.style.opacity === '1';
  try {
    await api(`/api/publicaciones/${id}/destacar`, 'POST', { destacada: !activa });
    document.querySelectorAll('[id^="dest-star-"]').forEach(s => {
      s.style.opacity = '0.3';
      s.title = '';
    });
    if (!activa) {
      star.style.opacity = '1';
      star.title = 'Destacada';
    }
    toast(activa ? '⭐ Destacado quitado' : '⭐ ¡Publicación destacada!');
  } catch(e) { toast(e.message); }
}

async function eliminarPubAdmin(id) {
  if (!confirm('¿Eliminar esta publicación?')) return;
  try {
    await api(`/api/publicaciones/${id}`, 'DELETE');
    document.getElementById(`row-pub-${id}`)?.remove();
    toast('🗑 Publicación eliminada');
  } catch(e) { toast(e.message); }
}

// ===== USUARIOS =====
async function cargarAdminUsers() {
  const wrap = document.getElementById('users-wrap');
  wrap.innerHTML = `<div class="spinner-feed"><span></span><span></span><span></span></div>`;
  try {
    const users = await api('/api/auth/admin/usuarios');
    wrap.innerHTML = `
      <div class="admin-table-wrap">
        <table class="admin-table">
          <thead><tr><th>#</th><th>Teléfono</th><th>Nombre</th><th>Localidad</th><th>Pubs</th><th>Rol</th><th>Acciones</th></tr></thead>
          <tbody>
            ${users.map(u => `
              <tr id="row-user-${u.id}">
                <td>${u.id}</td>
                <td><a href="/usuario/${encodeJsValue(u.telefono)}" class="admin-link">${escapeHtml(u.telefono)}</a></td>
                <td>${escapeHtml(u.nombre || '—')}</td>
                <td>${escapeHtml(u.localidad || '—')}</td>
                <td>${u.total_pubs}</td>
                <td>
                  <span class="admin-rol-badge ${u.rol === 'admin' ? 'admin' : ''}">${escapeHtml(u.rol || 'usuario')}</span>
                </td>
                <td class="admin-actions-cell">
                  <button class="admin-btn-rol" onclick="toggleRol(${JSON.stringify(String(u.telefono))}, ${JSON.stringify(String(u.rol || 'usuario'))})"
                    title="${u.rol === 'admin' ? 'Quitar admin' : 'Hacer admin'}">
                    ${u.rol === 'admin' ? '👑 Quitar' : '👑 Admin'}
                  </button>
                  <button class="admin-btn-del" onclick="banearUser('${u.telefono}')" title="Banear">🚫</button>
                </td>
              </tr>`).join('')}
          </tbody>
        </table>
      </div>`;
  } catch(e) {
    wrap.innerHTML = `<div class="empty"><p>${escapeHtml(e.message)}</p></div>`;
  }
}

async function toggleRol(telefono, rolActual) {
  const nuevo = rolActual === 'admin' ? 'usuario' : 'admin';
  if (!confirm(`¿Cambiar rol a ${nuevo}?`)) return;
  try {
    await api('/api/auth/admin/rol', 'POST', { telefono, rol: nuevo });
    toast(`✅ Rol cambiado a ${nuevo}`);
    cargarAdminUsers();
  } catch(e) { toast(e.message); }
}

async function banearUser(telefono) {
  if (!confirm(`¿Banear al usuario ${telefono}?`)) return;
  try {
    await api('/api/auth/admin/banear', 'POST', { telefono, baneado: true });
    toast('🚫 Usuario baneado');
    cargarAdminUsers();
  } catch(e) { toast(e.message); }
}

// ===== DIRECTORIO =====
let dirItems = [];

async function cargarAdminDir() {
  const wrap = document.getElementById('dir-admin-wrap');
  wrap.innerHTML = `<div class="spinner-feed"><span></span><span></span><span></span></div>`;
  try {
    const grupos = await api('/api/directorio');
    dirItems = Object.values(grupos).flat();
    const cats = [...new Set(Object.keys(grupos))];
    document.getElementById('cats-list').innerHTML = cats.map(c => `<option value="${c}">`).join('');
    if (!dirItems.length) {
      wrap.innerHTML = `<p style="color:var(--muted);font-size:.85rem;padding:.5rem 0">Sin entradas aún.</p>`;
      return;
    }
    wrap.innerHTML = `
      <div class="admin-table-wrap">
        <table class="admin-table">
          <thead><tr><th>Ico</th><th>Categoría</th><th>Nombre</th><th>Teléfono</th><th>Horario</th><th>Tipo</th><th></th></tr></thead>
          <tbody>
            ${dirItems.map(item => `
              <tr id="dir-row-${item.id}">
                <td>${escapeHtml(item.icono || '📍')}</td>
                <td>${escapeHtml(item.categoria)}</td>
                <td>${escapeHtml(item.nombre)}</td>
                <td>${escapeHtml(item.telefono || '—')}</td>
                <td>${escapeHtml(item.horario  || '—')}</td>
                <td>${escapeHtml(item.tipo || 'general')}</td>
                <td class="admin-actions-cell">
                  <button class="admin-btn-rol" onclick="editarDir(${item.id})">✏️</button>
                  <button class="admin-btn-del" onclick="eliminarDir(${item.id})">🗑</button>
                </td>
              </tr>`).join('')}
          </tbody>
        </table>
      </div>`;
  } catch(e) {
    wrap.innerHTML = `<p style="color:var(--error)">${escapeHtml(e.message)}</p>`;
  }
}

async function guardarDir() {
  const editId = document.getElementById('df-edit-id').value;
  const payload = {
    icono:     document.getElementById('df-icono').value.trim()   || '📍',
    categoria: document.getElementById('df-cat').value.trim(),
    nombre:    document.getElementById('df-nombre').value.trim(),
    telefono:  document.getElementById('df-tel').value.trim(),
    horario:   document.getElementById('df-horario').value.trim(),
    direccion: document.getElementById('df-dir').value.trim(),
    orden:     0,
    tipo:      document.getElementById('df-tipo').value
  };
  if (!payload.categoria || !payload.nombre) { toast('⚠️ Categoría y nombre son obligatorios'); return; }
  try {
    if (editId) {
      await api(`/api/directorio/${editId}`, 'PUT', payload);
      toast('✅ Actualizado');
    } else {
      await api('/api/directorio', 'POST', payload);
      toast('✅ Agregado');
    }
    limpiarFormDir();
    cargarAdminDir();
  } catch(e) { toast(e.message); }
}

function editarDir(id) {
  const item = dirItems.find(i => i.id === id);
  if (!item) return;
  document.getElementById('df-icono').value   = item.icono    || '📍';
  document.getElementById('df-cat').value     = item.categoria;
  document.getElementById('df-nombre').value  = item.nombre;
  document.getElementById('df-tel').value     = item.telefono || '';
  document.getElementById('df-horario').value = item.horario  || '';
  document.getElementById('df-dir').value     = item.direccion|| '';
  document.getElementById('df-tipo').value    = item.tipo     || 'general';
  document.getElementById('df-edit-id').value = id;
  document.getElementById('df-btn-txt').textContent = '💾 Guardar cambios';
  document.getElementById('dir-form').scrollIntoView({ behavior: 'smooth' });
}

function limpiarFormDir() {
  ['df-icono','df-cat','df-nombre','df-tel','df-horario','df-dir','df-foto','df-descripcion'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.value = id === 'df-icono' ? '📍' : '';
  });
  document.getElementById('df-tipo').value = 'general';
  document.getElementById('df-edit-id').value = '';
  document.getElementById('df-btn-txt').textContent = '➕ Agregar';
}

async function guardarDir() {
  const editId = document.getElementById('df-edit-id').value;
  const payload = {
    icono:     document.getElementById('df-icono').value.trim()   || '📍',
    categoria: document.getElementById('df-cat').value.trim(),
    nombre:    document.getElementById('df-nombre').value.trim(),
    telefono:  document.getElementById('df-tel').value.trim(),
    horario:   document.getElementById('df-horario').value.trim(),
    direccion: document.getElementById('df-dir').value.trim(),
    foto:      document.getElementById('df-foto').value.trim(),
    descripcion_corta: document.getElementById('df-descripcion').value.trim(),
    orden:     0,
    tipo:      document.getElementById('df-tipo').value
  };
  if (!payload.categoria || !payload.nombre) { toast('⚠️ Categoría y nombre son obligatorios'); return; }
  try {
    if (editId) {
      await api(`/api/directorio/${editId}`, 'PUT', payload);
      toast('✅ Actualizado');
    } else {
      await api('/api/directorio', 'POST', payload);
      toast('✅ Agregado');
    }
    limpiarFormDir();
    cargarAdminDir();
  } catch(e) { toast(e.message); }
}

function editarDir(id) {
  const item = dirItems.find(i => i.id === id);
  if (!item) return;
  document.getElementById('df-icono').value   = item.icono    || '📍';
  document.getElementById('df-cat').value     = item.categoria;
  document.getElementById('df-nombre').value  = item.nombre;
  document.getElementById('df-tel').value     = item.telefono || '';
  document.getElementById('df-horario').value = item.horario  || '';
  document.getElementById('df-dir').value     = item.direccion|| '';
  document.getElementById('df-foto').value    = item.foto     || '';
  document.getElementById('df-descripcion').value = item.descripcion_corta || '';
  document.getElementById('df-tipo').value    = item.tipo     || 'general';
  document.getElementById('df-edit-id').value = id;
  document.getElementById('df-btn-txt').textContent = '💾 Guardar cambios';
  document.getElementById('dir-form').scrollIntoView({ behavior: 'smooth' });
}

// ===== TRANSMISIONES (NUEVO) =====
let transItems = [];

async function cargarAdminTrans() {
  const wrap = document.getElementById('trans-admin-wrap');
  wrap.innerHTML = `<div class="spinner-feed"><span></span><span></span><span></span></div>`;
  try {
    const data = await api('/api/transmisiones');
    transItems = data;
    if (!transItems.length) {
      wrap.innerHTML = `<p style="color:var(--muted);font-size:.85rem;padding:.5rem 0">Sin transmisiones aún.</p>`;
      return;
    }
    wrap.innerHTML = `
      <div class="admin-table-wrap">
        <table class="admin-table">
          <thead><tr><th>#</th><th>Título</th><th>Categoría</th><th>Destacada</th><th>Activo</th><th>Orden</th><th>Fecha</th><th></th></tr></thead>
          <tbody>
            ${transItems.map(item => `
              <tr id="trans-row-${item.id}">
                <td>${item.id}</td>
                <td>${escapeHtml(item.titulo)}</td>
                <td>${escapeHtml(item.categoria)}</td>
                <td>${item.destacada ? '⭐' : '—'}</td>
                <td>${item.activo ? '✅' : '❌'}</td>
                <td>${item.orden}</td>
                <td>${timeAgo(item.fecha_creacion)}</td>
                <td class="admin-actions-cell">
                  <button class="admin-btn-rol" onclick="editarTrans(${item.id})">✏️</button>
                  <button class="admin-btn-del" onclick="eliminarTrans(${item.id})">🗑</button>
                </td>
              </tr>`).join('')}
          </tbody>
        </table>
      </div>`;
  } catch(e) {
    wrap.innerHTML = `<p style="color:var(--error)">${escapeHtml(e.message)}</p>`;
  }
}

async function guardarTrans() {
  const editId = document.getElementById('tf-edit-id').value;
  const payload = {
    titulo:      document.getElementById('tf-titulo').value.trim(),
    descripcion: document.getElementById('tf-descripcion').value.trim(),
    url:         document.getElementById('tf-url').value.trim(),
    categoria:   document.getElementById('tf-categoria').value,
    destacada:   document.getElementById('tf-destacada').checked,
    activo:      document.getElementById('tf-activo').checked,
    orden:       parseInt(document.getElementById('tf-orden').value) || 0
  };
  if (!payload.titulo || !payload.url) { toast('⚠️ Título y URL son obligatorios'); return; }
  try {
    if (editId) {
      await api(`/api/transmisiones/${editId}`, 'PUT', payload);
      toast('✅ Actualizado');
    } else {
      await api('/api/transmisiones', 'POST', payload);
      toast('✅ Agregado');
    }
    limpiarFormTrans();
    cargarAdminTrans();
  } catch(e) { toast(e.message); }
}

function editarTrans(id) {
  const item = transItems.find(i => i.id === id);
  if (!item) return;
  document.getElementById('tf-titulo').value      = item.titulo;
  document.getElementById('tf-descripcion').value = item.descripcion || '';
  document.getElementById('tf-url').value         = item.url;
  document.getElementById('tf-categoria').value   = item.categoria;
  document.getElementById('tf-destacada').checked = !!item.destacada;
  document.getElementById('tf-activo').checked    = !!item.activo;
  document.getElementById('tf-orden').value       = item.orden || 0;
  document.getElementById('tf-edit-id').value     = id;
  document.getElementById('tf-btn-txt').textContent = '💾 Guardar cambios';
  document.getElementById('trans-form').scrollIntoView({ behavior: 'smooth' });
}

function limpiarFormTrans() {
  document.getElementById('tf-titulo').value = '';
  document.getElementById('tf-descripcion').value = '';
  document.getElementById('tf-url').value = '';
  document.getElementById('tf-categoria').value = 'noticias';
  document.getElementById('tf-destacada').checked = false;
  document.getElementById('tf-activo').checked = true;
  document.getElementById('tf-orden').value = '0';
  document.getElementById('tf-edit-id').value = '';
  document.getElementById('tf-btn-txt').textContent = '➕ Agregar';
}

async function eliminarTrans(id) {
  if (!confirm('¿Eliminar esta transmisión?')) return;
  try {
    await api(`/api/transmisiones/${id}`, 'DELETE');
    document.getElementById(`trans-row-${id}`)?.remove();
    transItems = transItems.filter(i => i.id !== id);
    toast('🗑 Eliminado');
  } catch(e) { toast(e.message); }
}

// ===== CONFIGURACIÓN LOGO =====
function mostrarNombreArchivo(input) {
  const fileName = input.files[0]?.name || 'Ningún archivo seleccionado';
  document.getElementById('logo-file-name').textContent = fileName;
}

async function subirLogo() {
  const input = document.querySelector('input[name="logo"]');
  if (!input.files || !input.files[0]) {
    toast('⚠️ Selecciona una imagen primero');
    return;
  }
  const btn = document.getElementById('btn-subir-logo');
  btn.classList.add('loading');
  btn.disabled = true;
  const formData = new FormData();
  formData.append('logo', input.files[0]);
  try {
    const csrf = await getCsrfToken();
    const res = await fetch('/admin/logo', {
      method: 'POST',
      body: formData,
      credentials: 'include',
      headers: { 'X-CSRF-Token': csrf }
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Error al subir el logo');
    const preview = document.getElementById('logo-preview-img');
    if (data.logo_url) {
      preview.src = data.logo_url;
      toast('✅ Logo actualizado');
    } else {
      toast('✅ Logo actualizado. Recargando...');
      setTimeout(() => location.reload(), 800);
    }
    input.value = '';
    document.getElementById('logo-file-name').textContent = 'Ningún archivo seleccionado';
  } catch(e) {
    toast('Error: ' + e.message);
  } finally {
    btn.classList.remove('loading');
    btn.disabled = false;
  }
}

// ===== INICIO =====
document.addEventListener('DOMContentLoaded', function() {
  cargarAdminPubs();
});
</script>
